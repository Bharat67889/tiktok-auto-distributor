name: TikTok Auto Distributor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run TikTok API Distributor
        run: node tiktok_uploader.js
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
